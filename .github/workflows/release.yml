# Publicar e um ato deliberado: este workflow so roda quando alguem abre Actions, clica em
# "Run workflow" e escreve a versao. Nao ha gatilho por tag, de proposito — `git push --tags` leva
# junto tudo o que estiver local, e aqui uma tag empurrada por engano ja e a release: o Swift
# Package Manager resolve versao por tag, sem intermediario nenhum. No instante em que a tag chega
# ao GitHub, qualquer consumidor com `from: "..."` pode receber aquele codigo.
#
# As tags do iOS nao levam `v` — as existentes vao de `0.2.0` a `0.3.0`, e e esse o formato que o
# SPM resolve. Mudar agora quebraria todo consumidor que ja pinou uma versao.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versao a publicar, sem prefixo (ex.: 0.3.1). Tem que bater com o podspec.'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # As conferencias e os testes rodam antes e fora do job que publica, de proposito: assim nao
  # dependem de aprovacao. Quem for aprovar ja ve o resultado na tela, em vez de precisar aprovar
  # para descobrir que a versao estava errada.
  verificar:
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      version: ${{ steps.guard.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A primeira guarda e a que o iOS mais precisava. O podspec resolve a fonte por
      # `:tag => s.version`, entao um numero desatualizado nele nao falha em lugar nenhum — entrega
      # o codigo de outra release, em silencio. Aconteceu: o podspec ficou em 0.1.0 enquanto as tags
      # chegavam a 0.2.5, e so um consumidor de CocoaPods teria descoberto, recebendo um SDK cinco
      # releases atras.
      #
      # As outras duas cobrem o caso oposto: pedir uma versao que ja saiu. Uma tag existente nao
      # pode ser movida sem quebrar quem ja resolveu por ela, e o trunk nao aceita reenviar a mesma
      # versao de um pod.
      - name: Conferir a versao
        id: guard
        run: |
          IN="${{ inputs.version }}"
          POD=$(grep -oE "s\.version *= *'[0-9]+\.[0-9]+\.[0-9]+'" LightSession.podspec \
                  | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          echo "pedido=$IN  podspec=$POD"

          [ "$IN" = "$POD" ] || { echo "::error::voce pediu $IN e o podspec declara $POD" && exit 1; }

          if git rev-parse -q --verify "refs/tags/$IN" >/dev/null; then
            echo "::error::a tag $IN ja existe — esta versao ja foi publicada?" && exit 1
          fi

          # O trunk expoe as versoes publicadas do pod. Se a versao pedida ja estiver la, o
          # `pod trunk push` recusaria no fim, depois do lint inteiro.
          if curl -sf "https://trunk.cocoapods.org/api/v1/pods/LightSession" \
               | python3 -c "
          import json, sys
          alvo = '$IN'
          pod = json.load(sys.stdin)
          if alvo in [v['name'] for v in pod.get('versions', [])]:
              raise SystemExit(1)
          "; then
            echo "a versao $IN ainda nao esta no trunk"
          else
            echo "::error::LightSession $IN ja esta publicado no CocoaPods trunk" && exit 1
          fi

          echo "version=$IN" >> "$GITHUB_OUTPUT"

      # O simulador e escolhido em tempo de execucao, e nao fixado pelo nome.
      #
      # Um nome fixo amarra a release a quais aparelhos o runner do GitHub instala com o Xcode do
      # momento. Quando essa lista mudar — e ela muda a cada versao do Xcode — toda release passa
      # a falhar por um nome de aparelho, sem ter nada a ver com o codigo, e no pior momento
      # possivel: quando alguem acabou de pedir a release.
      - name: Testes
        run: |
          DEVICE=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          for runtime, devs in json.load(sys.stdin)['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for dev in devs:
                  if dev.get('isAvailable') and 'iPhone' in dev['name']:
                      print(dev['name']); raise SystemExit
          ")
          if [ -z "$DEVICE" ]; then
            echo "::error::nenhum simulador de iPhone disponivel no runner" && exit 1
          fi
          echo "simulador: $DEVICE"
          xcodebuild test -scheme LightSession \
            -destination "platform=iOS Simulator,name=$DEVICE"

  publicar:
    needs: verificar
    runs-on: macos-15
    timeout-minutes: 40

    # A trava que importa. `release` e um Environment com required reviewers: o job para aqui e
    # espera alguem clicar em "Review deployments" -> "Approve and deploy". Enquanto ninguem
    # aprovar, nenhuma tag e criada e nada e enviado ao trunk.
    #
    # E o lugar certo para o COCOAPODS_TRUNK_TOKEN. Movido de "repository secrets" para
    # "environment secrets" deste environment, ele deixa de ser legivel por qualquer job do
    # repositorio e passa a existir so nesta etapa, depois da aprovacao.
    environment: release

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Aqui a tag vem ANTES de publicar, ao contrario dos outros dois SDKs — e por um motivo
      # concreto, nao por estilo. O `pod trunk push` roda um lint que clona o repositorio na tag
      # declarada pelo podspec (`:tag => s.version`); sem a tag existindo no remoto, esse clone
      # falha e o push nao acontece. E a mesma tag e, por si so, a release para o Swift Package
      # Manager, que nao tem registry: e ela que o SPM resolve.
      - name: Marcar a tag
        env:
          V: ${{ needs.verificar.outputs.version }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$V" -m "$V"
          git push origin "$V"

      - name: Criar o Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.verificar.outputs.version }}
        run: gh release create "$V" --title "$V" --generate-notes --verify-tag

      # O segredo passou a ser obrigatorio. Enquanto este repositorio era privado o passo era
      # pulado quando o token faltava, porque o lint do trunk clona o `s.source` e o clone de um
      # repositorio privado falha — quebrar toda release por isso nao ajudava ninguem. O
      # repositorio e publico e o token esta configurado, entao a ausencia dele agora e um erro de
      # configuracao, e um erro de configuracao que passa em silencio deixaria a tag publicada e o
      # pod para tras, com as duas fontes divergindo.
      - name: Publicar no CocoaPods trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          # Testado no shell e nao num `if:` do workflow: a disponibilidade do contexto `secrets`
          # em condicionais varia por onde ela aparece, e uma condicao que silenciosamente avalia
          # como falsa pularia a publicacao sem dizer nada.
          if [ -z "$COCOAPODS_TRUNK_TOKEN" ]; then
            echo "::error::COCOAPODS_TRUNK_TOKEN ausente no environment release" && exit 1
          fi
          pod trunk push LightSession.podspec --allow-warnings
